<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClosetJH - Painel VIP</title>
  <style>
    :root {
      --bg-color: #0b0b0b;
      --card-bg: #141414;
      --gold-primary: #D4AF37;
      --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728);
      --text-color: #F5F5F5;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 10px 10px 80px 10px;
    }
    h1 {
      text-align: center;
      color: var(--gold-primary);
      font-size: 24px;
      letter-spacing: 2px;
      margin: 10px 0 2px 0;
    }
    p.subtitle {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 15px;
    }
    /* Menu de Abas iOS */
    .tab-bar {
      display: flex;
      justify-content: space-around;
      background: #111;
      border-top: 1px solid var(--gold-primary);
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 0;
      z-index: 1000;
    }
    .tab-item {
      color: #888;
      font-size: 10px;
      text-align: center;
      background: none;
      border: none;
      padding: 0;
      width: 20%;
    }
    .tab-item.active {
      color: var(--gold-primary);
      font-weight: bold;
    }
    .tab-item span {
      display: block;
      font-size: 18px;
      margin-bottom: 2px;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background-color: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    label {
      font-size: 11px;
      color: var(--gold-primary);
      font-weight: bold;
      display: block;
      margin: 8px 0 4px 0;
      text-transform: uppercase;
    }
    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 8px;
      background: #1f1f1f;
      border: 1px solid #333;
      color: #fff;
      font-size: 13px;
    }
    input:focus, textarea:focus { border-color: var(--gold-primary); outline: none; }
    .btn-gold {
      background: var(--gold-gradient);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 13px;
      margin-top: 8px;
    }
    .btn-outline {
      background: transparent;
      color: var(--gold-primary);
      border: 1px solid var(--gold-primary);
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      width: 100%;
      font-size: 12px;
      margin-top: 6px;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--gold-primary);
      margin-top: 10px;
    }
    .output-box {
      background: #181818;
      border-left: 3px solid var(--gold-primary);
      padding: 10px;
      font-size: 12px;
      white-space: pre-wrap;
      margin-top: 10px;
    }
    .size-picker {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }
    .size-btn {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #444;
      color: #fff;
      padding: 8px;
      font-size: 11px;
      border-radius: 6px;
    }
    .size-btn.selected {
      background: var(--gold-primary);
      color: #000;
      font-weight: bold;
    }
    .kpi-container {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .kpi-box {
      flex: 1;
      background: #1c1c1c;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #333;
    }
    .kpi-val { font-size: 18px; font-weight: bold; color: var(--gold-primary); }
    .kpi-lbl { font-size: 10px; color: #888; }
  </style>
</head>
<body>

  <h1>CLOSETJH</h1>
  <p class="subtitle">SISTEMA INTELIGENTE DE MODA & CONTEÚDO</p>

  <!-- TAB 1: CRIADOR DE TEMPLATE -->
  <div id="tab1" class="tab-content active">
    <div class="card">
      <label>1. Foto da Peça</label>
      <input type="file" id="imageInput" accept="image/*">
      <button class="btn-outline" onclick="analisarFotoComIA()">✨ Analisar Foto com IA (Auto-Preencher)</button>

      <label>2. Dados da Peça</label>
      <input type="text" id="nomePeca" placeholder="Nome do Look (Ex: Vestido Floral JH)">
      <input type="text" id="precoPeca" placeholder="Preço de Venda (Ex: R$ 199,90)">
      <input type="text" id="tecidoPeca" placeholder="Tecido (Ex: Sedinha)">
      
      <label>Grade de Tamanhos Disponíveis</label>
      <div class="size-picker">
        <button class="size-btn selected" onclick="toggleSize(this)">P</button>
        <button class="size-btn selected" onclick="toggleSize(this)">M</button>
        <button class="size-btn selected" onclick="toggleSize(this)">G</button>
        <button class="size-btn" onclick="toggleSize(this)">GG</button>
        <button class="size-btn" onclick="toggleSize(this)">ÚNICO</button>
      </div>

      <button class="btn-gold" onclick="gerarTemplate()">🖼️ Gerar Post para Instagram</button>
      <canvas id="canvas" width="1080" height="1920" style="display:none;"></canvas>
      <button class="btn-outline" id="downloadBtn" onclick="baixarImagem()" style="display:none;">📥 Salvar no iPhone</button>
      <button class="btn-outline" id="savePostBtn" onclick="salvarNoHistorico()" style="display:none;">💾 Salvar no Histórico da Loja</button>
    </div>
  </div>

  <!-- TAB 2: CALCULADORA DE LUCRO -->
  <div id="tab2" class="tab-content">
    <div class="card">
      <label>Calculadora de Margem de Lucro</label>
      <label>Preço de Custo (Atacado R$)</label>
      <input type="number" id="custoAtacado" placeholder="Ex: 65.00" oninput="calcularLucro()">
      
      <label>Preço de Venda (Varejo R$)</label>
      <input type="number" id="vendaVarejo" placeholder="Ex: 199.90" oninput="calcularLucro()">

      <div class="kpi-container">
        <div class="kpi-box">
          <div class="kpi-val" id="resLucro">R$ 0,00</div>
          <div class="kpi-lbl">Lucro Líquido</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-val" id="resMargem">0%</div>
          <div class="kpi-lbl">Margem %</div>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB 3: RADAR DE FORNECEDORES -->
  <div id="tab3" class="tab-content">
    <div class="card">
      <label>Radar de Fornecedores (Região da 44 / Polo Local)</label>
      <input type="text" id="buscaFornecedor" placeholder="Ex: Conjunto de Linho Alfaiataria">
      <button class="btn-gold" onclick="pesquisarFornecedores()">🔍 Garimpar Fábricas & Atacado</button>
      <div id="fornecedoresOutput" class="output-box">Digite o tipo de roupa para pesquisar estimativa de atacado e polos de confecção...</div>
    </div>
  </div>

  <!-- TAB 4: ASSISTENTE DE LEGENDA & STORIES -->
  <div id="tab4" class="tab-content">
    <div class="card">
      <label>Gerador de Legendas & Roteiros</label>
      <button class="btn-gold" onclick="gerarLegendaFeed()">📝 Criar Legenda de Alta Conversão</button>
      <button class="btn-gold" onclick="gerarRoteiroStories()">🔥 Criar Sequência de 3 Stories</button>
      <button class="btn-outline" onclick="gerarLinkZap()">📱 Gerar Link Direto do WhatsApp</button>
      <div id="aiOutput" class="output-box">O texto de vendas gerado aparecerá aqui...</div>
    </div>
  </div>

  <!-- TAB 5: HISTÓRICO DE LOOKS -->
  <div id="tab5" class="tab-content">
    <div class="card">
      <label>Histórico de Catalógo Salvo</label>
      <div id="historicoLista">Nenhum look salvo ainda.</div>
    </div>
  </div>

  <!-- MENU INFERIOR IOS -->
  <div class="tab-bar">
    <button class="tab-item active" onclick="switchTab('tab1', this)"><span>🖼️</span>Studio</button>
    <button class="tab-item" onclick="switchTab('tab2', this)"><span>📊</span>Lucro</button>
    <button class="tab-item" onclick="switchTab('tab3', this)"><span>📍</span>Atacado</button>
    <button class="tab-item" onclick="switchTab('tab4', this)"><span>📝</span>IA Vendas</button>
    <button class="tab-item" onclick="switchTab('tab5', this)"><span>📁</span>Looks</button>
  </div>

  <script>
    const GEMINI_KEY = "AQ.Ab8RN6LTWnxoiFm44ROn2pzdTkl4Bz2O1krSmvdTqX4M5QLuUQ";
    let imgElement = new Image();
    let base64Image = "";

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
      if(tabId === 'tab5') carregarHistorico();
    }

    function toggleSize(btn) {
      btn.classList.toggle('selected');
    }

    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = function(event) {
        imgElement.src = event.target.result;
        base64Image = event.target.result.split(',')[1];
      }
      if(file) reader.readAsDataURL(file);
    });

    async function analisarFotoComIA() {
      if(!base64Image) return alert('Carregue uma foto da peça primeiro!');
      alert('Analizando foto com IA...');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: "Analise esta roupa feminina da loja ClosetJH. Responda APENAS em formato JSON estrito: {\"nome\": \"Nome elegante do Look\", \"tecido\": \"Nome do Tecido (Ex: Linho/Sedinha)\"}" },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });
        const data = await response.json();
        const rawText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(rawText);
        
        if(parsed.nome) document.getElementById('nomePeca').value = parsed.nome;
        if(parsed.tecido) document.getElementById('tecidoPeca').value = parsed.tecido;
        alert('Análise concluída com sucesso!');
      } catch (err) {
        alert('Erro ao analisar foto: ' + err.message);
      }
    }

    function gerarTemplate() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const nome = document.getElementById('nomePeca').value || 'LOOK EXCLUSIVO';
      const preco = document.getElementById('precoPeca').value || 'R$ 00,00';
      const tecido = document.getElementById('tecidoPeca').value || 'PREMIUM';

      const tamanhos = Array.from(document.querySelectorAll('.size-btn.selected')).map(b => b.innerText).join(' | ');

      canvas.style.display = 'block';
      document.getElementById('downloadBtn').style.display = 'block';
      document.getElementById('savePostBtn').style.display = 'block';

      ctx.fillStyle = "#0b0b0b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (imgElement.src) {
        ctx.drawImage(imgElement, 140, 220, 800, 1180);
      }

      // Topo ClosetJH
      ctx.fillStyle = "#D4AF37";
      ctx.font = "bold 55px serif";
      ctx.textAlign = "center";
      ctx.fillText("CLOSETJH", canvas.width / 2, 90);

      ctx.font = "22px sans-serif";
      ctx.fillStyle = "#CCCCCC";
      ctx.fillText(nome.toUpperCase(), canvas.width / 2, 140);

      // Caixa de Preço
      ctx.fillStyle = "#D4AF37";
      ctx.beginPath();
      ctx.roundRect(140, 1440, 380, 130, 15);
      ctx.fill();

      ctx.fillStyle = "#000000";
      ctx.font = "bold 22px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("VALOR DA PEÇA", 160, 1480);
      ctx.font = "bold 44px sans-serif";
      ctx.fillText(preco, 160, 1535);

      // Tecido
      ctx.fillStyle = "rgba(20, 20, 20, 0.95)";
      ctx.strokeStyle = "#D4AF37";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(560, 1440, 380, 130, 15);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#D4AF37";
      ctx.font = "bold 24px sans-serif";
      ctx.fillText("TECIDO: " + tecido.toUpperCase(), 580, 1485);
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "19px sans-serif";
      ctx.fillText("✓ Edição Limitada", 580, 1525);

      // Grade de Tamanhos
      ctx.fillStyle = "#161616";
      ctx.strokeStyle = "#D4AF37";
      ctx.beginPath();
      ctx.roundRect(140, 1590, 800, 90, 15);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#D4AF37";
      ctx.font = "bold 24px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("TAMANHOS DISPONÍVEIS: " + (tamanhos || 'TAMANHO ÚNICO'), canvas.width / 2, 1645);
    }

    function baixarImagem() {
      const link = document.createElement('a');
      link.download = 'look-closetjh.png';
      link.href = document.getElementById('canvas').toDataURL();
      link.click();
    }

    function calcularLucro() {
      const custo = parseFloat(document.getElementById('custoAtacado').value) || 0;
      const venda = parseFloat(document.getElementById('vendaVarejo').value) || 0;
      const lucro = venda - custo;
      const margem = venda > 0 ? ((lucro / venda) * 100).toFixed(1) : 0;

      document.getElementById('resLucro').innerText = "R$ " + lucro.toFixed(2);
      document.getElementById('resMargem').innerText = margem + "%";
    }

    async function pesquisarFornecedores() {
      const termo = document.getElementById('buscaFornecedor').value || 'Moda Feminina';
      document.getElementById('fornecedoresOutput').innerText = "Garimpando polos de atacado e confecção...";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Você é um guia especializado no atacado de moda feminina da Região da 44 em Goiânia e confecções da região metropolitana. Para a peça '${termo}', forneça: 1. Faixa média de preço no atacado. 2. Regras de pedido mínimo típicas. 3. Dicas de garimpo e tecidos da peça.` }] }]
          })
        });
        const data = await response.json();
        document.getElementById('fornecedoresOutput').innerText = data.candidates[0].content.parts[0].text;
      } catch(err) {
        document.getElementById('fornecedoresOutput').innerText = "Erro ao pesquisar fornecedores: " + err.message;
      }
    }

    async function gerarLegendaFeed() {
      const nome = document.getElementById('nomePeca').value || 'Look Exclusivo';
      const preco = document.getElementById('precoPeca').value || 'Preço Especial';
      const tecido = document.getElementById('tecidoPeca').value || 'Premium';
      document.getElementById('aiOutput').innerText = "Gerando legenda...";

      const prompt = `Crie uma legenda altamente persuasiva para o Instagram da loja de moda feminina 'ClosetJH'. Produto: '${nome}', Tecido: '${tecido}', Preço: '${preco}'. Inclua emojis elegantes, gatilhos de escassez e hashtags de moda.`;
      
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });
      const data = await res.json();
      document.getElementById('aiOutput').innerText = data.candidates[0].content.parts[0].text;
    }

    async function gerarRoteiroStories() {
      const nome = document.getElementById('nomePeca').value || 'Look Exclusivo';
      document.getElementById('aiOutput').innerText = "Gerando roteiro de Stories...";

      const prompt = `Crie uma sequência de 3 Stories interativos para a loja ClosetJH vendendo o produto '${nome}'. Story 1: Enquete. Story 2: Mostrando detalhes. Story 3: Caixinha de perguntas / Direct.`;
      
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });
      const data = await res.json();
      document.getElementById('aiOutput').innerText = data.candidates[0].content.parts[0].text;
    }

    function gerarLinkZap() {
      const nome = document.getElementById('nomePeca').value || 'esta peça';
      const preco = document.getElementById('precoPeca').value || '';
      const msg = encodeURIComponent(`Olá ClosetJH! Vi o ${nome} por ${preco} no aplicativo e quero garantir o meu!`);
      const link = `https://wa.me/?text=${msg}`;
      window.open(link, '_blank');
    }

    function salvarNoHistorico() {
      const nome = document.getElementById('nomePeca').value || 'Look Sem Nome';
      const preco = document.getElementById('precoPeca').value || 'R$ 0,00';
      const posts = JSON.parse(localStorage.getItem('closetjh_posts') || '[]');
      posts.push({ nome, preco, data: new Date().toLocaleDateString('pt-BR') });
      localStorage.setItem('closetjh_posts', JSON.stringify(posts));
      alert('Look salvo com sucesso no histórico!');
    }

    function carregarHistorico() {
      const posts = JSON.parse(localStorage.getItem('closetjh_posts') || '[]');
      const container = document.getElementById('historicoLista');
      if(posts.length === 0) {
        container.innerHTML = "Nenhum look salvo ainda.";
        return;
      }
      container.innerHTML = posts.map(p => `
        <div style="background:#1e1e1e; padding:10px; border-radius:8px; margin-bottom:8px; border-left:3px solid #D4AF37;">
          <strong style="color:#D4AF37">${p.nome}</strong> - ${p.preco}<br>
          <small style="color:#888">Salvo em: ${p.data}</small>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
