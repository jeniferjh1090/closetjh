<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClosetJH - Painel de Criação</title>
  <style>
    :root {
      --bg-color: #0b0b0b;
      --card-bg: #141414;
      --gold-primary: #D4AF37;
      --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728);
      --text-color: #F5F5F5;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 15px;
    }
    h1 {
      text-align: center;
      color: var(--gold-primary);
      font-size: 26px;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    p.subtitle {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }
    label {
      font-size: 12px;
      color: var(--gold-primary);
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    input, textarea {
      background: #1f1f1f;
      border: 1px solid #333;
      color: #fff;
    }
    input:focus, textarea:focus {
      border-color: var(--gold-primary);
      outline: none;
    }
    .btn-gold {
      background: var(--gold-gradient);
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-outline {
      background: transparent;
      color: var(--gold-primary);
      border: 1px solid var(--gold-primary);
      font-weight: bold;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--gold-primary);
      margin-top: 10px;
    }
    .output-box {
      background: #181818;
      border-left: 3px solid var(--gold-primary);
      padding: 10px;
      font-size: 13px;
      white-space: pre-wrap;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>CLOSETJH</h1>
  <p class="subtitle">PAINEL EXCLUSIVO DE CONTEÚDO E GERADOR</p>

  <!-- CONFIGURAÇÃO DA CHAVE DE IA -->
  <div class="card">
    <label>Configuração da IA (Chave API Gemini)</label>
    <input type="password" id="apiKey" placeholder="Cole sua API Key do Google AI Studio aqui">
    <button class="btn-outline" onclick="salvarKey()">Salvar Chave</button>
  </div>

  <!-- EDITOR DE IMAGEM -->
  <div class="card">
    <label>1. Carregar Foto do Produto</label>
    <input type="file" id="imageInput" accept="image/*">
    
    <label>2. Informações da Peça</label>
    <input type="text" id="nomePeca" placeholder="Nome do Look (Ex: Vestido Floral JH)">
    <input type="text" id="precoPeca" placeholder="Preço (Ex: R$ 199,90)">
    <input type="text" id="tecidoPeca" placeholder="Tecido (Ex: Sedinha)">
    
    <button class="btn-gold" onclick="gerarTemplate()">🖼️ Gerar Template com Preço</button>
    <canvas id="canvas" width="1080" height="1920" style="display:none;"></canvas>
    <button class="btn-outline" id="downloadBtn" onclick="baixarImagem()" style="display:none;">📥 Baixar Foto Pronta</button>
  </div>

  <!-- GERADOR DE CONTEÚDO COM IA -->
  <div class="card">
    <label>3. Assistente de Vendas (IA)</label>
    <button class="btn-gold" onclick="gerarLegendaFeed()">📝 Gerar Legenda para Feed</button>
    <button class="btn-gold" onclick="gerarRoteiroStories()">🔥 Gerar Roteiro de Stories</button>
    <div id="aiOutput" class="output-box">O texto gerado pela IA aparecerá aqui...</div>
  </div>

  <script>
    let imgElement = new Image();

    // Salva a chave no navegador do celular
    function salvarKey() {
      const key = document.getElementById('apiKey').value;
      localStorage.setItem('gemini_key', key);
      alert('Chave API salva com sucesso!');
    }

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_key');
      if(savedKey) document.getElementById('apiKey').value = savedKey;
    }

    // Leitura da Imagem Enviada
    document.getElementById('imageInput').addEventListener('change', function(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        imgElement.src = event.target.result;
      }
      reader.readAsDataURL(e.target.files[0]);
    });

    // Renderiza a Moldura Luxo no Canvas
    function gerarTemplate() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const nome = document.getElementById('nomePeca').value || 'NOVO LOOK';
      const preco = document.getElementById('precoPeca').value || 'R$ 00,00';
      const tecido = document.getElementById('tecidoPeca').value || 'PREMIUM';

      canvas.style.display = 'block';
      document.getElementById('downloadBtn').style.display = 'block';

      // Fundo Escuro
      ctx.fillStyle = "#0b0b0b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Imagem Centralizada
      if (imgElement.src) {
        ctx.drawImage(imgElement, 140, 240, 800, 1200);
      }

      // Moldura Dourada Superior (Marca)
      ctx.fillStyle = "#D4AF37";
      ctx.font = "bold 55px serif";
      ctx.textAlign = "center";
      ctx.fillText("CLOSETJH", canvas.width / 2, 100);

      ctx.font = "24px sans-serif";
      ctx.fillStyle = "#CCCCCC";
      ctx.fillText("EXCLUSIVIDADE & ESTILO", canvas.width / 2, 150);

      // Caixa de Preço Dourada
      ctx.fillStyle = "#D4AF37";
      ctx.beginPath();
      ctx.roundRect(140, 1480, 380, 140, 15);
      ctx.fill();

      ctx.fillStyle = "#000000";
      ctx.font = "bold 24px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("VALOR DA PEÇA", 160, 1525);
      ctx.font = "bold 45px sans-serif";
      ctx.fillText(preco, 160, 1585);

      // Detalhes do Tecido
      ctx.fillStyle = "rgba(20, 20, 20, 0.9)";
      ctx.strokeStyle = "#D4AF37";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(560, 1480, 380, 140, 15);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#D4AF37";
      ctx.font = "bold 26px sans-serif";
      ctx.fillText("TECIDO: " + tecido.toUpperCase(), 580, 1530);
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "20px sans-serif";
      ctx.fillText("✓ Caimento Perfeito", 580, 1570);
      ctx.fillText("✓ Edição Limitada", 580, 1600);
    }

    function baixarImagem() {
      const canvas = document.getElementById('canvas');
      const link = document.createElement('a');
      link.download = 'post-closetjh.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    // Chamada de IA via API Gemini Gratuita
    async function chamarGemini(prompt) {
      const key = localStorage.getItem('gemini_key');
      if(!key) return alert('Por favor, insira e salve sua API Key do Gemini no topo!');

      document.getElementById('aiOutput').innerText = "Criando conteúdo mágico...";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });
        const data = await response.json();
        const texto = data.candidates[0].content.parts[0].text;
        document.getElementById('aiOutput').innerText = texto;
      } catch (err) {
        document.getElementById('aiOutput').innerText = "Erro ao conectar com a IA: " + err.message;
      }
    }

    function gerarLegendaFeed() {
      const nome = document.getElementById('nomePeca').value || 'Roupa da Moda';
      const preco = document.getElementById('precoPeca').value || 'preço especial';
      const tecido = document.getElementById('tecidoPeca').value || 'qualidade alta';
      
      const prompt = `Crie uma legenda persuasiva e elegante para o Instagram da loja de moda feminina 'ClosetJH'. O produto é '${nome}', tecido '${tecido}', custando '${preco}'. Inclua gatilhos mentais de elegância e exclusividade, hashtags estratégicas de moda feminina e chamada para compra via Direct.`;
      chamarGemini(prompt);
    }

    function gerarRoteiroStories() {
      const nome = document.getElementById('nomePeca').value || 'Look incrível';
      const prompt = `Crie uma sequência de 3 Stories interativos para o Instagram da loja ClosetJH vendendo o produto '${nome}'. Story 1: Enquete/Desejo. Story 2: Mostrando detalhes do tecido e caimento. Story 3: Chamada para ação com caixinha de perguntas ou link no direct.`;
      chamarGemini(prompt);
    }
  </script>
</body>
</html>
